# Settings shared by every domain unless a domain file overrides them.
quantiles: [0.025, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.975]
interval_levels: [0.8, 0.9, 0.95]

backtest:
  scheme: rolling_origin       # expanding window, refit/re-forecast at each origin
  use_vintages: true           # score on data as known at each forecast date

metrics: [mase, smape, crps, coverage, interval_width]

uncertainty:
  conformal: true
  calibration_window: 24       # recent errors used for conformal adjustment
